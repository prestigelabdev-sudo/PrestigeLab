<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Panel admin · Prestige Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#000E23;--panel:#081A38;--raised:#0F2447;--paper:#F2E9D8;--gold:#D4AF37;--line:#22355c;--muted:#8496b8;--bad:#e5736b;--ok:#6fcf97;--r:3px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:14px/1.45 Inter,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
h1,h2{font-family:Poppins,sans-serif;font-weight:700}
.btn{background:var(--gold);color:var(--ink);font-weight:600;padding:10px 18px;border-radius:var(--r)}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{border:1px solid var(--line);padding:8px 14px;border-radius:var(--r)}
.ghost:hover{border-color:var(--gold)}
.danger{color:var(--bad);border-color:#5a2f33}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--panel);border:1px solid var(--line);padding:32px;width:100%;max-width:380px;display:grid;gap:14px}
#login h1{font-size:22px}
.msg{color:var(--bad);min-height:18px;font-size:13px}
label.f{display:grid;gap:5px;color:var(--muted);font-size:12.5px}
/* top */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:18px}header h1 span{color:var(--gold)}
header div{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px 28px 80px}
.tools{display:grid;grid-template-columns:1fr 160px 170px auto;gap:10px;margin-bottom:12px}
.sum{color:var(--muted);margin-bottom:12px}
.sum b{color:var(--paper)}
.row{display:grid;grid-template-columns:56px 1fr 150px 100px 180px 52px 78px;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-bottom:0;background:var(--panel)}
.row:last-child{border-bottom:1px solid var(--line)}
.row.off{opacity:.6}
.th{width:56px;height:56px;object-fit:cover;background:var(--raised);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);font-size:11px}
.nm b{display:block;font-weight:600}.nm small{color:var(--muted);font-family:ui-monospace,monospace;font-size:11.5px}
.mut{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:2px;padding:1px 6px;font-size:12px}
.chip.z{color:var(--muted)}.chip.low{border-color:var(--gold);color:var(--gold)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px solid var(--line)}
/* switch */
.sw{position:relative;width:42px;height:24px;display:inline-block}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:.15s}
.sw input:checked+i{background:var(--gold)}.sw input:checked+i::after{left:21px;background:var(--ink)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(0,14,35,.7);z-index:9}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){#dr{animation:none}}
#dr>div.hd{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
#dr form{overflow:auto;padding:22px 24px;display:grid;gap:18px;flex:1;align-content:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sec{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.sec h2{font-size:14px}
.img{display:flex;gap:14px;align-items:center}
.pv{width:110px;height:110px;flex:none;object-fit:cover;background:var(--raised);border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12px;padding:6px}
.drop{flex:1;display:grid;gap:8px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:10px;color:var(--muted)}.seg button.on{background:var(--gold);color:var(--ink);font-weight:600}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sizes label{display:grid;gap:4px;text-align:center;color:var(--muted);font-size:12.5px}
.ft{display:flex;gap:10px;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--gold);padding:10px 18px;border-radius:var(--r);z-index:20}
#toast.err{border-color:var(--bad)}
@media(max-width:820px){
 header,main{padding-left:16px;padding-right:16px}
 .tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.tools .btn{grid-column:1/-1}
 .row{grid-template-columns:56px 1fr 52px;gap:6px 12px}
 .row .cat,.row .pr,.row .st{grid-column:2/-1}.row .ed{grid-column:1/-1}.row .ed button{width:100%}
 .g3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <form id="lf">
    <h1>Panel de Prestige Lab</h1>
    <p class="mut">Entra con tu cuenta de administrador.</p>
    <label class="f">Correo<input type="email" id="em" autocomplete="username" required></label>
    <label class="f">Contraseña<input type="password" id="pw" autocomplete="current-password" required></label>
    <div class="msg" id="lm" role="alert"></div>
    <button class="btn" id="lb">Entrar</button>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <h1>Prestige Lab <span>· Panel</span></h1>
    <div><span id="who"></span><button class="ghost" id="out">Salir</button></div>
  </header>
  <main>
    <div class="tools">
      <input id="q" type="search" placeholder="Buscar por nombre, SKU o color" aria-label="Buscar">
      <select id="fc" aria-label="Categoría"><option value="">Todas las categorías</option><option value="H">Hombre</option><option value="M">Mujer</option><option value="C">Casual</option><option value="A">Accesorio</option></select>
      <select id="fe" aria-label="Estado"><option value="">Todos los estados</option><option value="act">Visibles</option><option value="ina">Ocultos</option><option value="ago">Agotados</option><option value="img">Sin foto</option></select>
      <button class="btn" id="nw">Nuevo producto</button>
    </div>
    <p class="sum" id="sum"></p>
    <div id="list"></div>
  </main>
</section>

<div id="ov" class="hide"></div>
<aside id="dr" class="hide" aria-label="Editor de producto">
  <div class="hd"><h1 id="dt" style="font-size:18px">Producto</h1><button class="ghost" id="cl" type="button">Cerrar</button></div>
  <form id="ef" autocomplete="off">
    <div class="img">
      <img class="pv" id="pv" alt="" hidden><div class="pv" id="pn">Sin foto</div>
      <div class="drop">
        <input type="file" id="fi" accept="image/*" hidden>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ghost" id="up">Subir foto</button><button type="button" class="ghost danger" id="rm">Quitar</button></div>
        <div class="bar hide" id="pb"><i></i></div>
        <input id="iu" type="url" placeholder="o pega la URL de la imagen" aria-label="URL de la imagen">
      </div>
    </div>

    <div class="g2">
      <label class="f">Nombre<input id="nm" required maxlength="120"></label>
      <label class="f">Precio (COP)<input id="pr" type="number" min="0" step="1000" required></label>
    </div>

    <div class="sec">
      <h2>Código del producto (SKU)</h2>
      <div class="g3">
        <label class="f">Categoría<select id="ca"><option value="H">Hombre</option><option value="M">Mujer</option><option value="C">Casual</option><option value="A">Accesorio</option></select></label>
        <label class="f">Código<input id="co" maxlength="10" placeholder="PNR" style="text-transform:uppercase"></label>
        <label class="f">Color<select id="cc"></select></label>
      </div>
      <label class="f">SKU final<input id="sk" required placeholder="PL-H-PNR-BLK" style="text-transform:uppercase;font-family:ui-monospace,monospace"></label>
    </div>

    <div class="g2">
      <label class="f">Subcategoría<input id="su" list="sl" placeholder="Camiseta, Gorra…"><datalist id="sl"></datalist></label>
      <label class="f" style="align-content:end">Visible en la tienda<span class="sw"><input type="checkbox" id="es" checked><i></i></span></label>
    </div>
    <label class="f">Descripción (opcional)<textarea id="de"></textarea></label>

    <div class="sec">
      <h2>Tallas y stock</h2>
      <div class="seg" role="group" aria-label="Tipo de talla"><button type="button" data-m="multi">Varias tallas</button><button type="button" data-m="unica">Talla única</button></div>
      <div class="sizes" id="sm">
        <label>S<input type="number" min="0" id="sS" value="0"></label><label>M<input type="number" min="0" id="sM" value="0"></label>
        <label>L<input type="number" min="0" id="sL" value="0"></label><label>XL<input type="number" min="0" id="sXL" value="0"></label>
      </div>
      <label class="f hide" id="su1">Unidades disponibles<input type="number" min="0" id="sU" value="0"></label>
    </div>
  </form>
  <div class="ft"><button class="ghost danger hide" id="dl" type="button">Eliminar</button><span style="flex:1"></span><button class="ghost" id="cn" type="button">Cancelar</button><button class="btn" id="sv" type="button">Guardar cambios</button></div>
</aside>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://rdtfbrhhtpdrzrschapx.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdGZicmhodHBkcnpyc2NoYXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODgxNTIsImV4cCI6MjEwNTY2NDE1Mn0.PQZAhz3U8nv2sEcpcUbFwq7zXZGxYtI-Z2qt4aWTluI";
const CLOUD_NAME="roqwoww1", UPLOAD_PRESET="Prestige";

const $=s=>document.querySelector(s);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const CATS={H:'Hombre',M:'Mujer',C:'Casual',A:'Accesorio'};
const COLORES={WHT:'Blanco',BLK:'Negro',GRY:'Gris',RED:'Rojo',BLU:'Azul',GRN:'Verde',YLW:'Amarillo',ORG:'Naranja',PNK:'Rosa',PRP:'Morado',BRN:'Marrón',BEG:'Beige',CRM:'Crema',NVY:'Azul marino',CML:'Camel',TAN:'Marrón claro',OLV:'Oliva',KHK:'Caqui',MST:'Mostaza',MAR:'Granate',BUR:'Borgoña',LIL:'Lila',LAV:'Lavanda',MNT:'Menta',SKY:'Azul cielo',TEA:'Verde azulado',COR:'Coral',ROS:'Rosa viejo',SND:'Arena',STN:'Piedra',CHR:'Carbón',SLV:'Plateado',GLD:'Dorado',DBL:'Azul oscuro',LBL:'Azul claro',DGR:'Gris oscuro',LGR:'Gris claro',WAS:'Lavado',IND:'Índigo',MUL:'Multicolor',CAM:'Camuflaje',STR:'Rayas',PAT:'Estampado'};
const SUBS=['Camiseta','Polo','Camisa','Guayabera','Short','Pantalón','Sudadera','Chaqueta','Conjunto','Leggings','Top','Tenis','Gorra','Billetera','Perfume','Bolso'];
const SKU_RE=/^PL-[HMCA]-[A-Z0-9]+-[A-Z0-9]+$/;
let items=[],cur=null,mode='multi',skuManual=false,toastT;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-CO');
const thumb=(u,w)=>u&&u.includes('/image/upload/')?u.replace('/image/upload/','/image/upload/f_auto,q_auto,w_'+w+'/'):u;
function toast(t,err){const e=$('#toast');e.textContent=t;e.className=err?'err':'';clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hide'),3200)}
const stockOf=p=>(p.variantes||[]).reduce((a,v)=>a+v.stock,0);

/* ---------- sesión ---------- */
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#lm').textContent='';$('#lb').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  $('#lb').disabled=false;
  if(error){$('#lm').textContent='Correo o contraseña incorrectos.';return}
  enter();
};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function enter(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data,error}=await sb.from('admins').select('user_id').maybeSingle();
  if(error||!data){await sb.auth.signOut();$('#lm').textContent='Esta cuenta no tiene permisos de administrador.';return}
  $('#who').textContent=session.user.email;
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  load();
}
async function load(){
  const {data,error}=await sb.from('productos_base').select('*,variantes(talla,stock)').order('created_at',{ascending:false}).order('sku_base');
  if(error){toast('No se pudo cargar el catálogo: '+error.message,1);return}
  items=data;render();
}

/* ---------- lista ---------- */
function render(){
  const q=$('#q').value.trim().toLowerCase(),c=$('#fc').value,f=$('#fe').value;
  const list=items.filter(p=>{
    if(c&&p.categoria!==c)return false;
    if(f==='act'&&p.estado!=='Activo')return false;
    if(f==='ina'&&p.estado!=='Inactivo')return false;
    if(f==='ago'&&stockOf(p)>0)return false;
    if(f==='img'&&p.imagen_url)return false;
    return !q||(p.nombre_producto+' '+p.sku_base+' '+(p.color||'')).toLowerCase().includes(q);
  });
  const vis=items.filter(p=>p.estado==='Activo').length;
  $('#sum').innerHTML=`<b>${items.length}</b> productos · <b>${vis}</b> visibles · <b>${items.filter(p=>stockOf(p)===0).length}</b> agotados · <b>${items.filter(p=>!p.imagen_url).length}</b> sin foto`;
  $('#list').innerHTML=list.length?list.map(p=>{
    const v=Object.fromEntries((p.variantes||[]).map(x=>[x.talla,x.stock]));
    const chips=p.talla_unica?`<span class="chip ${v.UNICA?(v.UNICA<2?'low':''):'z'}">Única: ${v.UNICA||0}</span>`:['S','M','L','XL'].map(t=>`<span class="chip ${!v[t]?'z':v[t]<2?'low':''}">${t} ${v[t]||0}</span>`).join('');
    return `<div class="row ${p.estado!=='Activo'?'off':''}">
      ${p.imagen_url?`<img class="th" src="${esc(thumb(p.imagen_url,120))}" alt="" loading="lazy">`:'<div class="th">Sin foto</div>'}
      <div class="nm"><b>${esc(p.nombre_producto)}</b><small>${esc(p.sku_base)}${p.color?' · '+esc(p.color):''}</small></div>
      <div class="cat mut">${CATS[p.categoria]}${p.subcategoria?' · '+esc(p.subcategoria):''}</div>
      <div class="pr">${money(p.precio)}</div>
      <div class="st chips">${chips}</div>
      <label class="sw" title="Visible en la tienda"><input type="checkbox" data-t="${p.id}" ${p.estado==='Activo'?'checked':''} aria-label="Visible en la tienda"><i></i></label>
      <div class="ed"><button class="ghost" data-e="${p.id}">Editar</button></div></div>`}).join(''):'<div class="empty">No hay productos con esos filtros.</div>';
}
['#q','#fc','#fe'].forEach(s=>$(s).addEventListener('input',render));
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b)openEd(items.find(p=>p.id===b.dataset.e))});
$('#list').addEventListener('change',async e=>{
  const id=e.target.dataset.t;if(!id)return;
  const estado=e.target.checked?'Activo':'Inactivo';
  const {error}=await sb.from('productos_base').update({estado}).eq('id',id);
  if(error){toast('No se pudo cambiar el estado',1);e.target.checked=!e.target.checked;return}
  items.find(p=>p.id===id).estado=estado;render();toast(estado==='Activo'?'Producto visible en la tienda':'Producto oculto de la tienda');
});

/* ---------- editor ---------- */
$('#cc').innerHTML='<option value="">Sin color</option>'+Object.entries(COLORES).map(([k,v])=>`<option value="${k}">${v} (${k})</option>`).join('');
$('#sl').innerHTML=SUBS.map(s=>`<option value="${s}">`).join('');
function setMode(m){mode=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#sm').classList.toggle('hide',m==='unica');$('#su1').classList.toggle('hide',m!=='unica')}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  if(b.dataset.m==='unica'&&mode==='multi'&&!+$('#sU').value)$('#sU').value=['S','M','L','XL'].reduce((a,t)=>a+(+$('#s'+t).value||0),0);
  setMode(b.dataset.m)});
function syncSku(){if(!skuManual)$('#sk').value=('PL-'+$('#ca').value+'-'+$('#co').value.trim()+'-'+$('#cc').value).toUpperCase()}
['#ca','#co','#cc'].forEach(s=>$(s).addEventListener('input',syncSku));
$('#sk').addEventListener('input',()=>skuManual=true);
$('#ca').addEventListener('change',()=>{if(!cur.id)setMode(['A','C'].includes($('#ca').value)?'unica':'multi')});
function showImg(u){const has=!!u;$('#pv').hidden=!has;$('#pn').classList.toggle('hide',has);if(has)$('#pv').src=thumb(u,300);$('#iu').value=u||''}
$('#iu').addEventListener('change',()=>showImg($('#iu').value.trim()));
$('#rm').onclick=()=>showImg('');

function openEd(p){
  cur=p||{};const v=Object.fromEntries((cur.variantes||[]).map(x=>[x.talla,x.stock]));
  $('#dt').textContent=p?'Editar producto':'Nuevo producto';
  $('#dl').classList.toggle('hide',!p);
  const parts=(cur.sku_base||'').split('-');
  $('#nm').value=cur.nombre_producto||'';$('#pr').value=cur.precio??'';$('#su').value=cur.subcategoria||'';$('#de').value=cur.descripcion||'';
  $('#es').checked=cur.estado!=='Inactivo';$('#ca').value=cur.categoria||'H';
  $('#co').value=parts[2]||'';$('#cc').value=COLORES[parts[3]]?parts[3]:'';$('#sk').value=cur.sku_base||'';
  skuManual=!!p;if(!p)syncSku();
  ['S','M','L','XL'].forEach(t=>$('#s'+t).value=v[t]||0);$('#sU').value=v.UNICA||0;
  setMode(p?(p.talla_unica?'unica':'multi'):'multi');showImg(cur.imagen_url);
  $('#ov').classList.remove('hide');$('#dr').classList.remove('hide');$('#nm').focus();
}
function closeEd(){$('#ov').classList.add('hide');$('#dr').classList.add('hide')}
['#cl','#cn','#ov'].forEach(s=>$(s).onclick=closeEd);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dr').classList.contains('hide'))closeEd()});
$('#nw').onclick=()=>openEd(null);

/* ---------- Cloudinary ---------- */
$('#up').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    $('#pb').classList.remove('hide');$('#up').disabled=true;
    const url=await upload(await shrink(file),$('#sk').value.trim()||'PL');
    showImg(url);toast('Foto subida. Guarda los cambios para aplicarla.');
  }catch(err){toast('No se pudo subir la foto: '+err.message,1)}
  finally{$('#pb').classList.add('hide');$('#up').disabled=false;$('#pb i').style.width='0'}
};
async function shrink(file){
  const b=await createImageBitmap(file),k=Math.min(1,1600/Math.max(b.width,b.height));
  if(k===1&&file.size<1.5e6)return file;
  const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
  c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,file.type==='image/png'?'image/png':'image/jpeg',.9));
}
function upload(blob,sku){return new Promise((ok,ko)=>{
  const f=new FormData();f.append('file',blob);f.append('upload_preset',UPLOAD_PRESET);f.append('public_id',sku+'_'+Date.now());f.append('tags','prestige-lab');
  const x=new XMLHttpRequest();x.open('POST','https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload');
  x.upload.onprogress=e=>{if(e.lengthComputable)$('#pb i').style.width=(e.loaded/e.total*100)+'%'};
  x.onload=()=>{let r={};try{r=JSON.parse(x.responseText)}catch(_){}x.status<300&&r.secure_url?ok(r.secure_url):ko(new Error(r.error&&r.error.message||'respuesta inválida'))};
  x.onerror=()=>ko(new Error('sin conexión'));x.send(f)})}

/* ---------- guardar / eliminar ---------- */
$('#sv').onclick=async()=>{
  const sku=$('#sk').value.trim().toUpperCase(),nombre=$('#nm').value.trim(),precio=$('#pr').value;
  if(!nombre)return toast('Escribe el nombre del producto',1);
  if(precio===''||+precio<0)return toast('Escribe un precio válido',1);
  if(!SKU_RE.test(sku))return toast('SKU inválido. Formato: PL-H-CODIGO-COLOR',1);
  if(sku.split('-')[1]!==$('#ca').value)return toast('La categoría del SKU no coincide con la categoría elegida',1);
  const cc=$('#cc').value;
  const payload={id:cur.id||null,sku_base:sku,nombre_producto:nombre,descripcion:$('#de').value,color:cc?COLORES[cc]:'',categoria:$('#ca').value,subcategoria:$('#su').value,precio:+precio,estado:$('#es').checked?'Activo':'Inactivo',imagen_url:$('#iu').value.trim(),talla_unica:mode==='unica',
    stock:mode==='unica'?{UNICA:+$('#sU').value||0}:{S:+$('#sS').value||0,M:+$('#sM').value||0,L:+$('#sL').value||0,XL:+$('#sXL').value||0}};
  $('#sv').disabled=true;
  const {error}=await sb.rpc('guardar_producto',{p:payload});
  $('#sv').disabled=false;
  if(error)return toast(error.code==='23505'?'Ya existe un producto con ese SKU':'No se pudo guardar: '+error.message,1);
  closeEd();toast('Producto guardado');load();
};
$('#dl').onclick=async()=>{
  if(!confirm('¿Eliminar "'+cur.nombre_producto+'"? Esta acción no se puede deshacer. Si solo quieres ocultarlo, apaga "Visible en la tienda".'))return;
  const {error}=await sb.from('productos_base').delete().eq('id',cur.id);
  if(error)return toast('No se pudo eliminar: '+error.message,1);
  closeEd();toast('Producto eliminado');load();
};
enter();
</script>
